<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ledger Entry - Udhaar Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container">
        <a class="back-link" href="/customers/{{.CustomerID}}">&larr; Back to ledger</a>
        <div class="page-heading">
            <span class="eyebrow">LEDGER CORRECTION</span>
            <h1>Edit transaction</h1>
            <p>Save the corrected amount, date, or item details. The ledger will mark this entry as edited.</p>
        </div>
        <form action="/customers/{{.CustomerID}}/entries/{{.ID}}/edit" method="POST" class="form-card">
            <label for="entry_type">Type</label>
            <select id="entry_type" name="entry_type">
                <option value="credit" {{if eq .EntryType "credit"}}selected{{end}}>Udhaar</option>
                <option value="payment" {{if eq .EntryType "payment"}}selected{{end}}>Customer paid</option>
            </select>

            <label for="amount">Amount</label>
            <input type="number" step="0.01" min="0.01" id="amount" name="amount" value="{{printf "%.2f" .Amount}}" required>

            <label for="entry_date">Date</label>
            <input type="date" id="entry_date" name="entry_date" value="{{.EntryDate.Format "2006-01-02"}}" required>

            <label for="note">Items or note</label>
            <input type="text" id="note" name="note" value="{{.Note}}" maxlength="255">

            <button type="submit">Save changes</button>
        </form>
    </main>
</body>
</html>
