<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container">
        <div class="page-heading">
            <span class="eyebrow">NEW RECORD</span>
            <h1>Add customer</h1>
            <p>Start a clear, respectful ledger for every customer bothways.</p>
        </div>
        <form action="/customers" method="POST" class="form-card">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">WhatsApp number (optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="+919812345678">

            <button type="submit">Save Customer</button>
        </form>
        <a class="back-link" href="/dashboard">&larr; Back to dashboard</a>
    </main>
</body>
</html>
