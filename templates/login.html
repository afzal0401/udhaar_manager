<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udhaar Manager - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-card">
        <div class="brand-mark" role="img" aria-label="Udhaar Manager logo">
            <span class="brand-glow"></span>
            <span class="brand-page brand-page-back"></span>
            <span class="brand-page brand-page-front"></span>
            <span class="brand-monogram">UM</span>
            <span class="brand-rupee">&#8377;</span>
            <span class="brand-line brand-line-long"></span>
            <span class="brand-line brand-line-short"></span>
            <span class="brand-check" aria-hidden="true">&#10003;</span>
        </div>
        <div class="brand-wordmark">
            <h1>Udhaar Manager</h1>
            <span>SMART CREDIT LEDGER</span>
        </div>
        <p class="brand-quote">Keep every credit clear, every relationship strong.</p>
        <p>Enter your mobile number to get started.</p>
        <form action="/login/otp" method="POST">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+919812345678" required>
            <button type="submit">Send OTP</button>
        </form>
    </div>
</body>
</html>
