<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Settings - Udhaar Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container">
        <a class="back-link" href="/dashboard">&larr; Back to dashboard</a>
        <div class="page-heading">
            <span class="eyebrow">ACCOUNT CONTROL</span>
            <h1>Owner settings</h1>
            <p>Keep your shop identity accurate and ready for every customer.</p>
        </div>
        <p>Update the shop details shown in your account.</p>

        <form action="/settings" method="POST" class="form-card">
            <label for="shop_name">Shop name</label>
            <input type="text" id="shop_name" name="shop_name" value="{{.Name}}" maxlength="150" required>

            <label for="owner_name">Owner name</label>
            <input type="text" id="owner_name" name="owner_name" value="{{.OwnerName}}" maxlength="100" placeholder="Enter your name">

            <label for="owner_email">Recovery email</label>
            <input type="email" id="owner_email" name="owner_email" value="{{.OwnerEmail}}" maxlength="255" autocomplete="email" required>

            <label for="plan">Plan</label>
            <select id="plan" name="plan">
                <option value="trial" {{if eq .Plan "trial"}}selected{{end}}>Trial</option>
                <option value="basic" {{if eq .Plan "basic"}}selected{{end}}>Basic</option>
                <option value="pro" {{if eq .Plan "pro"}}selected{{end}}>Pro</option>
            </select>

            <label for="owner_phone">Mobile number</label>
            <input type="tel" id="owner_phone" value="{{.OwnerPhone}}" readonly>

            <button type="submit">Save changes</button>
        </form>
    </main>
</body>
</html>
